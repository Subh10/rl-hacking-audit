name: RL Hacking Audit by Subh10
description: Adversarially test an LLM app/agent and gate CI on the result
inputs:
  target: {description: "Target spec (openai:<model>, anthropic:<model>, py:<module>:<fn>, http://...)", required: true}
  fail-on: {description: "Fail at or above this severity", default: high}
  baseline: {description: "Path to a baseline report.json", default: ""}
  args: {description: "Extra ai-auditor scan arguments", default: ""}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: "3.12"}
    - run: pip install "${{ github.action_path }}"
      shell: bash
    - run: |
        ai-auditor scan --target "${{ inputs.target }}" --fail-on "${{ inputs.fail-on }}" \
          --formats json,sarif,md --out ai-auditor-out ${{ inputs.baseline != '' && format('--baseline {0}', inputs.baseline) || '' }} ${{ inputs.args }}
      shell: bash
    - run: cat ai-auditor-out/report.md >> "$GITHUB_STEP_SUMMARY"
      if: always()
      shell: bash
branding:
  icon: shield
  color: green
